<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Explicit, versioned: iOS caches the icon by URL, so a new file name is
         the only reliable way to ship a new home-screen icon. Bump -vN when
         the artwork changes. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-v2.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#34c759" />
    <!-- iOS home-screen label: kept short so it isn't truncated (~12 chars). -->
    <meta name="apple-mobile-web-app-title" content="Bloom Sales" />
    <title>Bloom Sales Force</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
