server {
    listen 80;
    server_name orders.smartquotations.eu;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name orders.smartquotations.eu;

    ssl_certificate     /etc/letsencrypt/live/orders.smartquotations.eu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/orders.smartquotations.eu/privkey.pem;

    root /var/www/direct-orders;
    index index.html;

    # Long cache for hashed assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback
    location / {
        try_files $uri /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
