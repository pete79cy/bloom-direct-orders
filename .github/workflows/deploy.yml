name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Build
        env:
          VITE_API_BASE_URL: https://smartquotations.eu
          VITE_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: npm run build

      # Atomic SSH + tar transfer. We previously used burnett01/rsync-
      # deployments@7.0.1, which kept failing intermittently with
      # "rsync: connection unexpectedly closed (0 bytes received so
      # far) [sender] (code 255)" — the GitHub-hosted runner's outbound
      # SSH was being dropped before rsync could finish negotiating.
      # Multiple deploys in a row left the production assets stuck at
      # an old commit while the workflow ran appeared green-then-red.
      #
      # tar | ssh is one connection, one stream, and atomic at the file
      # level — the remote tar extraction completes only after the full
      # archive is received. Far more resilient to the same flakey SSH
      # path. The remote side wipes /var/www/direct-orders/* before
      # extraction so old hashed chunks don't linger forever (the same
      # role --delete played on rsync).
      - name: Deploy via SSH + tar
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          set -euo pipefail

          # The repo's SSH_HOST / SSH_USER secrets were originally pasted
          # with a trailing newline (a classic GitHub Secrets UI mishap —
          # paste from a terminal often includes the trailing \n). rsync-
          # deployments@7.0.1 was quoting them in a way that hid the
          # problem on the wire but produced the "***@" link_stat errors
          # in the rsync log. A direct ssh call fails harder with
          # "hostname contains invalid characters". Strip CR/LF/space
          # before use so the workflow is robust against the secret
          # contents instead of requiring the operator to re-paste.
          HOST=$(printf '%s' "$SSH_HOST" | tr -d '\r\n\t ')
          USER=$(printf '%s' "$SSH_USER" | tr -d '\r\n\t ')

          echo "Deploying to host: ${HOST:0:3}*** as user ${USER:0:3}***"

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

          # ssh-keyscan can fail transiently when the runner -> VPS
          # network blip we already see in the rsync logs hits the
          # scan port. With `set -e` that single blip kills the whole
          # deploy with no useful output. Make it best-effort + retry
          # up to 3 times instead. If it ultimately fails, the real
          # tar | ssh below will fail loudly with the actual reason.
          for attempt in 1 2 3; do
            if ssh-keyscan -T 10 -H "$HOST" >> ~/.ssh/known_hosts 2>/tmp/keyscan.err; then
              echo "ssh-keyscan ok (attempt $attempt)"
              break
            fi
            echo "ssh-keyscan attempt $attempt failed:"
            cat /tmp/keyscan.err || true
            sleep 3
          done

          # Pipe a gzip tarball straight to a remote shell that wipes
          # the target dir first, then extracts. -C dist . sends the
          # CONTENTS of dist/ (not the dist/ folder itself) so the
          # files land directly under /var/www/direct-orders/.
          tar czf - -C dist . | ssh \
            -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=20 \
            -o ServerAliveCountMax=6 \
            -i ~/.ssh/id_deploy \
            "$USER@$HOST" \
            'set -e; cd /var/www/direct-orders && rm -rf ./* && tar xzf -'

          # Sanity check — fail loudly if /var/www/direct-orders/index.html
          # wasn't refreshed by this deploy. rsync used to mask this kind
          # of half-deploy under a green status.
          ssh -i ~/.ssh/id_deploy "$USER@$HOST" \
            'ls -la /var/www/direct-orders/index.html'
